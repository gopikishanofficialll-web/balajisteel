<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALAJI STEEL & RAILING | Jayram Bishnoi</title>
    <!-- External Style Sheets -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* CSS STYLING & VARIABLES */
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #d97706;
            --light-bg: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* NAVIGATION NAVBAR */
        header {
            background-color: #0f172a;
            color: white;
            padding: 1.2rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 99999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .logo span {
            color: var(--accent);
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* HERO AREA */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://unsplash.com') no-repeat center center/cover;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
            margin-top: 60px;
        }

        .hero h2 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 700px;
            color: #e2e8f0;
        }

        .btn-premium {
            background-color: var(--accent);
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        /* SECTIONS STRUCTURE */
        section {
            padding: 5rem 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h3 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            position: relative;
            display: inline-block;
        }

        .section-header h3::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--accent);
            margin: 10px auto 0;
        }

        /* ABOUT BALAJI STEEL */
        .about {
            background-color: white;
        }

        .about-container {
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .about-text {
            flex: 1;
            min-width: 300px;
        }

        .about-text h4 {
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .about-features {
            margin-top: 20px;
        }

        .feature-item {
            margin-bottom: 10px;
            font-weight: 600;
        }

        .feature-item i {
            color: var(--accent);
            margin-right: 10px;
        }

        /* SERVICES CARDS */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .service-box {
            background: white;
            padding: 35px 25px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
            transition: transform 0.3s;
        }

        .service-box:hover {
            transform: translateY(-5px);
        }

        .service-box i {
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .service-box h4 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* PREMIUM GALLERY */
        .gallery {
            background-color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-card {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            height: 250px;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CONTACT FORM AREA */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .contact-details {
            background-color: var(--secondary);
            color: white;
            padding: 35px;
            border-radius: 6px;
        }

        .contact-details h4 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-row i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .contact-form-box {
            background-color: white;
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }

        .submit-btn {
            background-color: var(--accent);
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* STICKY WHATSAPP GREEN BUTTON */
        .whatsapp-sticky {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 30px;
            right: 25px;
            background-color: #25d366;
            color: white;
            border-radius: 50%;
            text-align: center;
            font-size: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        footer {
            background-color: var(--primary);
            color: #94a3b8;
            text-align: center;
            padding: 2rem 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .contact-wrapper { grid-template-columns: 1fr; }
            nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- Main Navigation Header -->
    <header>
        <div class="logo">
            <h1>BALAJI <span>STEEL & RAILING</span></h1>
        </div>
        <nav>
            <a href="#home">होम</a>
            <a href="#about">हमारे बारे में</a>
            <a href="#services">सेवाएं</a>
            <a href="#gallery">गैलरी</a>
            <a href="#contact">संपर्क फॉर्म</a>
        </nav>
    </header>

    <!-- 1. HERO HOME SECTION -->
    <section class="hero" id="home">
        <h2>Premium Steel & Railing Works</h2>
