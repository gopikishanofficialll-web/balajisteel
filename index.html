<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALAJI STEEL & RAILING | Premium Steel & Architecture Work</title>
    <!-- Font Awesome for Premium Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts for Professional Typography -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* --- MODERN LUXURY HARDWARE THEME --- */
        :root {
            --primary: #0f172a;       /* Deep Slate/Black (Ultra Premium) */
            --secondary: #1e293b;     /* Steel Dark Gray */
            --accent: #d97706;        /* Premium Hardware Gold/Amber */
            --accent-hover: #b45309;  /* Dark Gold */
            --light-bg: #f8fafc;      /* Clean White/Gray Background */
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Top Luxury Navbar */
        header {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1.2rem 8%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 99999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--accent);
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        nav a:hover, nav a.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 4px;
        }

        /* 1. HERO PAGE (First Impression) */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://unsplash.com') no-repeat center center/cover;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
            margin-top: 60px;
        }

        .hero h2 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 35px;
            max-width: 700px;
            color: #e2e8f0;
        }

        .btn-premium {
            background-color: var(--accent);
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            border: none;
            cursor: pointer;
        }

        .btn-premium:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.6);
        }

        /* Section Layouts */
        section {
            padding: 6rem 8%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h3 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            position: relative;
            display: inline-block;
            text-transform: uppercase;
        }

        .section-header h3::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--accent);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .section-header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* 2. ABOUT US PAGE */
        .about {
            background-color: white;
        }

        .about-container {
            display: flex;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .about-text {
            flex: 1;
            min-width: 300px;
        }

        .about-text h4 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .about-text p {
            color: var(--text-dark);
            margin-bottom: 20px;
            font-size: 1.05rem;
            text-align: justify;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .feature-item i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .about-img {
            flex: 1;
            min-width: 300px;
            border-left: 5px solid var(--accent);
            padding-left: 20px;
        }

        .about-img img {
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 3. SERVICES PAGE */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-box {
            background: white;
            padding: 40px 30px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border-top: 3px solid transparent;
            transition: all 0.3s ease;
            text-align: center;
        }

        .service-box:hover {
            transform: translateY(-8px);
            border-top: 3px solid var(--accent);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .service-box i {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .service-box h4 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .service-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 4. PREMIUM GALLERY PAGE */
        .gallery {
            background-color: white;
        }

        .gallery-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .gallery-card {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            height: 280px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.1);
        }
